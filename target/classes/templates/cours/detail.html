<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Détail Cours</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('cours')}"></div>

    <main class="main-content">
        <div class="page-header fade-in">
            <div>
                <h1><i class="bi bi-book text-primary me-1"></i> <span th:text="${cours.intitule}"></span></h1>
                <div class="subtitle">
                    Code : <strong th:text="${cours.code}"></strong> ·
                    <span th:text="${cours.credits}"></span> crédits
                </div>
            </div>
            <a href="/cours" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Retour</a>
        </div>

        <h5 class="mb-3 fade-in"><i class="bi bi-people"></i> Étudiants inscrits</h5>
        <div class="table-card fade-in">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                    <tr>
                        <th>Matricule</th>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Moyenne</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="inscription : ${cours.inscriptions}">
                        <td th:text="${inscription.etudiant.matricule}"></td>
                        <td th:text="${inscription.etudiant.nom}"></td>
                        <td th:text="${inscription.etudiant.prenom}"></td>
                        <td>
                            <span th:if="${inscription.moyenne} != null"
                                  th:class="${inscription.moyenne >= 14} ? 'badge-soft success' : (${inscription.moyenne >= 10} ? 'badge-soft warning' : 'badge-soft danger')"
                                  th:text="${#numbers.formatDecimal(inscription.moyenne, 1, 2)} + '/20'"></span>
                            <span th:unless="${inscription.moyenne} != null" class="badge-soft neutral">Pas encore notée</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="empty-state" th:if="${#lists.isEmpty(cours.inscriptions)}">
                    <i class="bi bi-people"></i>
                    <p class="mb-0">Aucun étudiant inscrit</p>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
