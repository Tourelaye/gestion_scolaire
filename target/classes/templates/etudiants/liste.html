<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Étudiants - Gestion Scolaire</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/sidebar :: toasts}"></div>
<div th:replace="~{fragments/sidebar :: flash-messages}"></div>

<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('etudiants')}"></div>

    <main class="main-content">
        <div class="page-header fade-in">
            <div>
                <h1>Étudiants</h1>
                <div class="subtitle" th:text="${#lists.size(etudiants)} + ' étudiant(s) enregistré(s)'">0 étudiant(s)</div>
            </div>
            <a href="/etudiants/nouveau" class="btn btn-primary" sec:authorize="hasRole('ADMIN')">
                <i class="bi bi-plus-lg"></i> Nouvel étudiant
            </a>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3 fade-in">
            <div class="search-bar">
                <i class="bi bi-search"></i>
                <input type="text" id="searchInput" class="form-control" placeholder="Rechercher un étudiant...">
            </div>
        </div>

        <div class="table-card fade-in">
            <div class="table-responsive">
                <table class="table" id="etudiantsTable">
                    <thead>
                    <tr>
                        <th>Matricule</th>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Email</th>
                        <th>Date de naissance</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="etudiant : ${etudiants}">
                        <td th:text="${etudiant.matricule}"></td>
                        <td th:text="${etudiant.nom}"></td>
                        <td th:text="${etudiant.prenom}"></td>
                        <td th:text="${etudiant.email}"></td>
                        <td th:text="${etudiant.dateNaissance}"></td>
                        <td class="text-end">
                            <a th:href="@{/etudiants/{id}(id=${etudiant.id})}" class="btn btn-icon btn-outline-secondary" title="Voir"><i class="bi bi-eye"></i></a>
                            <a th:href="@{/etudiants/modifier/{id}(id=${etudiant.id})}" class="btn btn-icon btn-outline-primary" sec:authorize="hasRole('ADMIN')" title="Modifier"><i class="bi bi-pencil-square"></i></a>
                            <a href="#" class="btn btn-icon btn-outline-danger btn-delete" sec:authorize="hasRole('ADMIN')" title="Supprimer"
                               th:attr="data-delete-message=${'Supprimer l''étudiant ' + etudiant.prenom + ' ' + etudiant.nom + ' ?'}"
                               th:href="@{/etudiants/supprimer/{id}(id=${etudiant.id})}">
                                <i class="bi bi-trash3"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="empty-state" th:if="${#lists.isEmpty(etudiants)}">
                    <i class="bi bi-people"></i>
                    <p class="mb-0">Aucun étudiant enregistré</p>
                </div>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/sidebar :: confirm-delete-modal}"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>
    document.getElementById('searchInput').addEventListener('input', function () {
        var term = this.value.toLowerCase();
        document.querySelectorAll('#etudiantsTable tbody tr').forEach(function (row) {
            row.style.display = row.textContent.toLowerCase().includes(term) ? '' : 'none';
        });
    });
</script>
</body>
</html>
