<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accueil - Gestion Scolaire</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/sidebar :: toasts}"></div>
<div th:replace="~{fragments/sidebar :: flash-messages}"></div>

<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></div>

    <main class="main-content">
        <div class="page-header fade-in">
            <div>
                <h1>Tableau de bord</h1>
                <div class="subtitle">Vue d'ensemble de votre établissement</div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="stat-card slide-up stagger-1">
                    <div class="stat-icon blue"><i class="bi bi-people-fill"></i></div>
                    <div class="flex-grow-1">
                        <div class="stat-value" th:text="${nbEtudiants}">0</div>
                        <div class="stat-label">Étudiants</div>
                        <a href="/etudiants" class="stat-link mt-1 d-inline-block">Voir la liste <i class="bi bi-arrow-right"></i></a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card slide-up stagger-2">
                    <div class="stat-icon green"><i class="bi bi-book-fill"></i></div>
                    <div class="flex-grow-1">
                        <div class="stat-value" th:text="${nbCours}">0</div>
                        <div class="stat-label">Cours</div>
                        <a href="/cours" class="stat-link mt-1 d-inline-block">Voir la liste <i class="bi bi-arrow-right"></i></a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card slide-up stagger-3">
                    <div class="stat-icon orange"><i class="bi bi-person-check-fill"></i></div>
                    <div class="flex-grow-1">
                        <div class="stat-value" th:text="${nbInscriptions}">0</div>
                        <div class="stat-label">Inscriptions</div>
                        <a href="/inscriptions" class="stat-link mt-1 d-inline-block">Voir la liste <i class="bi bi-arrow-right"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
