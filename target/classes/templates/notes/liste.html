<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notes</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/sidebar :: toasts}"></div>
<div th:replace="~{fragments/sidebar :: flash-messages}"></div>

<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('inscriptions')}"></div>

    <main class="main-content">
        <div class="page-header fade-in">
            <div>
                <h1><i class="bi bi-journal-text text-primary me-1"></i> Notes</h1>
                <div class="subtitle">
                    <span th:text="${inscription.etudiant.prenom} + ' ' + ${inscription.etudiant.nom}"></span> ·
                    <span th:text="${inscription.cours.intitule}"></span>
                </div>
            </div>
            <a href="/inscriptions" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Retour</a>
        </div>

        <div class="row g-3 mb-4 fade-in">
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-icon blue"><i class="bi bi-bar-chart-fill"></i></div>
                    <div>
                        <div class="stat-value" th:if="${inscription.moyenne} != null" th:text="${#numbers.formatDecimal(inscription.moyenne, 1, 2)}">--</div>
                        <div class="stat-value" th:unless="${inscription.moyenne} != null">--</div>
                        <div class="stat-label">Moyenne pondérée / 20</div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-icon green"><i class="bi bi-list-ol"></i></div>
                    <div>
                        <div class="stat-value" th:text="${#lists.size(notes)}">0</div>
                        <div class="stat-label">Évaluations saisies</div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-icon orange">
                        <i th:if="${inscription.moyenne} != null and ${inscription.moyenne >= 14}" class="bi bi-emoji-smile"></i>
                        <i th:if="${inscription.moyenne} != null and ${inscription.moyenne < 14} and ${inscription.moyenne >= 10}" class="bi bi-emoji-neutral"></i>
                        <i th:if="${inscription.moyenne} != null and ${inscription.moyenne < 10}" class="bi bi-emoji-frown"></i>
                        <i th:unless="${inscription.moyenne} != null" class="bi bi-question-circle"></i>
                    </div>
                    <div>
                        <span th:if="${inscription.moyenne} != null and ${inscription.moyenne >= 14}" class="badge-soft success">Excellent</span>
                        <span th:if="${inscription.moyenne} != null and ${inscription.moyenne < 14} and ${inscription.moyenne >= 10}" class="badge-soft warning">Moyen</span>
                        <span th:if="${inscription.moyenne} != null and ${inscription.moyenne < 10}" class="badge-soft danger">Faible</span>
                        <span th:unless="${inscription.moyenne} != null" class="badge-soft neutral">Pas encore notée</span>
                        <div class="stat-label mt-1">Appréciation</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="table-card mb-4 fade-in">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                    <tr>
                        <th>Type d'évaluation</th>
                        <th>Valeur / 20</th>
                        <th>Coefficient</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="note : ${notes}">
                        <td th:text="${note.typeEvaluation}"></td>
                        <td>
                            <span th:class="${note.valeur >= 14} ? 'badge-soft success' : (${note.valeur >= 10} ? 'badge-soft warning' : 'badge-soft danger')"
                                  th:text="${note.valeur}"></span>
                        </td>
                        <td th:text="${note.coefficient}"></td>
                        <td class="text-end">
                            <a href="#" class="btn btn-icon btn-outline-danger btn-delete"
                               sec:authorize="hasAnyRole('ADMIN','ENSEIGNANT')" title="Supprimer"
                               th:attr="data-delete-message=${'Supprimer cette note (' + note.typeEvaluation + ') ?'}"
                               th:href="@{/notes/supprimer/{id}/{iid}(id=${note.id}, iid=${inscription.id})}">
                                <i class="bi bi-trash3"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="empty-state" th:if="${#lists.isEmpty(notes)}">
                    <i class="bi bi-journal-x"></i>
                    <p class="mb-0">Aucune note saisie</p>
                </div>
            </div>
        </div>

        <h5 class="mb-3 fade-in"><i class="bi bi-plus-circle"></i> Ajouter une note</h5>
        <div class="card p-4 fade-in" style="max-width: 720px;">
            <form th:action="@{/notes/ajouter/{id}(id=${inscription.id})}" th:object="${nouvelleNote}" method="post" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Type d'évaluation</label>
                    <div class="input-icon-group">
                        <input type="text" th:field="*{typeEvaluation}" class="form-control" placeholder="Ex: Contrôle, Examen"
                               th:classappend="${#fields.hasErrors('typeEvaluation')} ? 'is-invalid'">
                        <i class="bi bi-clipboard-check"></i>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('typeEvaluation')}" th:errors="*{typeEvaluation}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Valeur (/20)</label>
                    <div class="input-icon-group">
                        <input type="number" step="0.01" th:field="*{valeur}" class="form-control" placeholder="0 à 20"
                               th:classappend="${#fields.hasErrors('valeur')} ? 'is-invalid'">
                        <i class="bi bi-star"></i>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('valeur')}" th:errors="*{valeur}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Coefficient</label>
                    <div class="input-icon-group">
                        <input type="number" step="0.1" th:field="*{coefficient}" class="form-control" placeholder="Ex: 1"
                               th:classappend="${#fields.hasErrors('coefficient')} ? 'is-invalid'">
                        <i class="bi bi-sliders"></i>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('coefficient')}" th:errors="*{coefficient}"></div>
                </div>
                <div class="col-md-2 d-flex align-items-start">
                    <button type="submit" class="btn btn-primary w-100 mt-4"><i class="bi bi-plus-lg"></i> Ajouter</button>
                </div>
            </form>
        </div>
    </main>
</div>

<div th:replace="~{fragments/sidebar :: confirm-delete-modal}"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
