# ===================== Application =====================
spring.application.name=gestion-scolaire
server.port=8081

# ===================== Base de donnees PostgreSQL =====================
# Assurez-vous que la base "gestion_scolaire" existe deja (PostgreSQL ne la cree pas
# automatiquement comme MySQL) : voir database.sql ou "CREATE DATABASE gestion_scolaire;"
spring.datasource.url=jdbc:postgresql://localhost:5433/gestion_scolaire
spring.datasource.username=postgres
spring.datasource.password=2004
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================== JPA / Hibernate =====================
# update : garde les donnees entre redemarrages (pratique pour la demo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================== Thymeleaf =====================
spring.thymeleaf.cache=false

# ===================== Logs =====================
logging.level.org.springframework.security=INFO
