<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulaire Cours</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('cours')}"></div>

    <main class="main-content">
        <div class="page-header fade-in">
            <div>
                <h1 th:text="${cours.id} != null ? 'Modifier le cours' : 'Nouveau cours'"></h1>
                <div class="subtitle">Renseignez les informations du cours</div>
            </div>
        </div>

        <div class="card p-4 fade-in" style="max-width: 720px;">
            <form th:action="@{/cours/enregistrer}" th:object="${cours}" method="post" class="row g-3">
                <input type="hidden" th:field="*{id}">

                <div class="col-md-4">
                    <label class="form-label">Code</label>
                    <div class="input-icon-group">
                        <input type="text" th:field="*{code}" class="form-control" placeholder="Ex: INF301" th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'">
                        <i class="bi bi-upc-scan"></i>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                </div>

                <div class="col-md-5">
                    <label class="form-label">Intitulé</label>
                    <div class="input-icon-group">
                        <input type="text" th:field="*{intitule}" class="form-control" placeholder="Ex: Programmation Java" th:classappend="${#fields.hasErrors('intitule')} ? 'is-invalid'">
                        <i class="bi bi-book"></i>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('intitule')}" th:errors="*{intitule}"></div>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Crédits</label>
                    <div class="input-icon-group">
                        <input type="number" th:field="*{credits}" class="form-control" placeholder="Ex: 6" th:classappend="${#fields.hasErrors('credits')} ? 'is-invalid'">
                        <i class="bi bi-award"></i>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('credits')}" th:errors="*{credits}"></div>
                </div>

                <div class="col-12 mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Enregistrer</button>
                    <a href="/cours" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Annuler</a>
                </div>
            </form>
        </div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
