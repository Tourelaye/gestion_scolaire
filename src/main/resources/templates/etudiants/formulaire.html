<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulaire Étudiant</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('etudiants')}"></div>

    <main class="main-content">
        <div class="page-header fade-in">
            <div>
                <h1 th:text="${etudiant.id} != null ? 'Modifier l''étudiant' : 'Nouvel étudiant'"></h1>
                <div class="subtitle">Renseignez les informations de l'étudiant</div>
            </div>
        </div>

        <div class="card p-4 fade-in" style="max-width: 720px;">
            <form th:action="@{/etudiants/enregistrer}" th:object="${etudiant}" method="post" class="row g-3">
                <input type="hidden" th:field="*{id}">

                <div class="col-md-6">
                    <label class="form-label">Matricule</label>
                    <div class="input-icon-group">
                        <input type="text" th:field="*{matricule}" class="form-control" placeholder="Ex: ET2026001" th:classappend="${#fields.hasErrors('matricule')} ? 'is-invalid'">
                        <i class="bi bi-hash"></i>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('matricule')}" th:errors="*{matricule}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <div class="input-icon-group">
                        <input type="email" th:field="*{email}" class="form-control" placeholder="Entrez l'adresse email" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                        <i class="bi bi-envelope"></i>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Nom</label>
                    <div class="input-icon-group">
                        <input type="text" th:field="*{nom}" class="form-control" placeholder="Entrez le nom" th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'">
                        <i class="bi bi-person"></i>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Prénom</label>
                    <div class="input-icon-group">
                        <input type="text" th:field="*{prenom}" class="form-control" placeholder="Entrez le prénom" th:classappend="${#fields.hasErrors('prenom')} ? 'is-invalid'">
                        <i class="bi bi-person"></i>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Date de naissance</label>
                    <div class="input-icon-group">
                        <input type="date" th:field="*{dateNaissance}" class="form-control" th:classappend="${#fields.hasErrors('dateNaissance')} ? 'is-invalid'">
                        <i class="bi bi-calendar3"></i>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('dateNaissance')}" th:errors="*{dateNaissance}"></div>
                </div>

                <div class="col-12 mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Enregistrer</button>
                    <a href="/etudiants" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Annuler</a>
                </div>
            </form>
        </div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
