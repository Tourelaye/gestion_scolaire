<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscriptions - Gestion Scolaire</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/sidebar :: toasts}"></div>
<div th:replace="~{fragments/sidebar :: flash-messages}"></div>

<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('inscriptions')}"></div>

    <main class="main-content">
        <div class="page-header fade-in">
            <div>
                <h1>Inscriptions</h1>
                <div class="subtitle" th:text="${#lists.size(inscriptions)} + ' inscription(s) enregistrée(s)'">0 inscription(s)</div>
            </div>
            <a href="/inscriptions/nouvelle" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> Nouvelle inscription
            </a>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3 fade-in">
            <div class="search-bar">
                <i class="bi bi-search"></i>
                <input type="text" id="searchInput" class="form-control" placeholder="Rechercher...">
            </div>
        </div>

        <div class="table-card fade-in">
            <div class="table-responsive">
                <table class="table" id="inscriptionsTable">
                    <thead>
                    <tr>
                        <th>Étudiant</th>
                        <th>Cours</th>
                        <th>Date d'inscription</th>
                        <th>Moyenne</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="inscription : ${inscriptions}">
                        <td th:text="${inscription.etudiant.prenom} + ' ' + ${inscription.etudiant.nom}"></td>
                        <td th:text="${inscription.cours.intitule}"></td>
                        <td th:text="${inscription.dateInscription}"></td>
                        <td>
                            <span th:if="${inscription.moyenne} != null"
                                  th:class="${inscription.moyenne >= 14} ? 'badge-soft success' : (${inscription.moyenne >= 10} ? 'badge-soft warning' : 'badge-soft danger')"
                                  th:text="${#numbers.formatDecimal(inscription.moyenne, 1, 2)} + '/20'"></span>
                            <span th:unless="${inscription.moyenne} != null" class="badge-soft neutral">—</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/notes/inscription/{id}(id=${inscription.id})}" class="btn btn-icon btn-outline-primary" title="Notes"><i class="bi bi-journal-text"></i></a>
                            <a href="#" class="btn btn-icon btn-outline-danger btn-delete" sec:authorize="hasRole('ADMIN')" title="Supprimer"
                               th:attr="data-delete-message=${'Supprimer l''inscription de ' + inscription.etudiant.prenom + ' au cours ' + inscription.cours.intitule + ' ?'}"
                               th:href="@{/inscriptions/supprimer/{id}(id=${inscription.id})}">
                                <i class="bi bi-trash3"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="empty-state" th:if="${#lists.isEmpty(inscriptions)}">
                    <i class="bi bi-person-check"></i>
                    <p class="mb-0">Aucune inscription enregistrée</p>
                </div>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/sidebar :: confirm-delete-modal}"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>
    document.getElementById('searchInput').addEventListener('input', function () {
        var term = this.value.toLowerCase();
        document.querySelectorAll('#inscriptionsTable tbody tr').forEach(function (row) {
            row.style.display = row.textContent.toLowerCase().includes(term) ? '' : 'none';
        });
    });
</script>
</body>
</html>
