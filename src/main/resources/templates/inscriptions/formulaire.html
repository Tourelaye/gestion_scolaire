<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nouvelle Inscription</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('inscriptions')}"></div>

    <main class="main-content">
        <div class="page-header fade-in">
            <div>
                <h1>Nouvelle inscription</h1>
                <div class="subtitle">Associer un étudiant à un cours</div>
            </div>
        </div>

        <div class="card p-4 fade-in" style="max-width: 720px;">
            <form th:action="@{/inscriptions/enregistrer}" method="post" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label"><i class="bi bi-person"></i> Étudiant</label>
                    <select name="etudiantId" class="form-select" required>
                        <option value="" disabled selected>-- Choisir un étudiant --</option>
                        <option th:each="etudiant : ${etudiants}"
                                th:value="${etudiant.id}"
                                th:text="${etudiant.matricule} + ' - ' + ${etudiant.prenom} + ' ' + ${etudiant.nom}"></option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label"><i class="bi bi-book"></i> Cours</label>
                    <select name="coursId" class="form-select" required>
                        <option value="" disabled selected>-- Choisir un cours --</option>
                        <option th:each="cours : ${coursListe}"
                                th:value="${cours.id}"
                                th:text="${cours.code} + ' - ' + ${cours.intitule}"></option>
                    </select>
                </div>

                <div class="col-12 mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Inscrire</button>
                    <a href="/inscriptions" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Annuler</a>
                </div>
            </form>
        </div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
